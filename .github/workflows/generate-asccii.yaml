name: Generate ASCII
on: push


jobs:
  build_job:

     runs-on: ubuntu-latest
     steps:
       - name: Checkout repo
         uses: actions/checkout@v7
       - name: install cowsay
         run: sudo apt-get install cowsay -y
       - name: build app
         run: cowsay -f dragon "Run for cover, I am a dragon ... RAWR" >> dragon.txt
       - name: uplaod files
         uses: actions/upload-artifact@v7
         with:
          name: my-artifact
          path: dragon.txt
     #  - name: Executing shell script.
    #     run: sh ./script.sh
         
    #   - name: list files
    #     run: ls 
    #   - name: Read files
    #     run: cat README.md
  test_job:
    needs: build_job
    runs-on: ubuntu-latest
    steps:
      - name: dowload file
        uses: actions/download-artifact@v7
        with:
         name: my-artifact
      - name: list files
        run: ls -ltr dragon.txt
  deploy_job:
    needs: test_job
    runs-on: ubuntu-latest
    steps:
      - name: dowload file
        uses: actions/download-artifact@v7
        with:
         name: my-artifact
      - name: Read file
        run: cat  dragon.txt  