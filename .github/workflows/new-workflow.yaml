name: My Test workflow
on: push
jobs:
    build_job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v7
            - name: list files
              run: ls -ltr
            - name: build docker image
              run: docker build -t my-app .
            - name: run the images
              run: docker run -d --name my-container -p 8080:80 my-app:latest
            - name: list the containers
              run: docker ps
            - name: browser nginx
              run: curl localhost:8080 > output.txt
            - name: uplaod files
              uses: actions/upload-artifact@v7
              with:
                name: my-artifact
                path: output.txt
    test_jobs:
      uses: build_job
      runs-on: ubuntu-latest
      steps:
            - name: Download the files
              uses: actions/download-artifact@v7
              with:
               name: my-artifact
          
